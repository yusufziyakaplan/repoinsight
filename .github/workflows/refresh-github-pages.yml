name: Refresh and publish GitHub Pages

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'github-pages/**'
      - '.github/workflows/refresh-github-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh repository data
        run: node github-pages/scripts/update-data.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save refreshed data and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/data.json github-pages/history.json
          if git diff --cached --quiet; then
            echo "Repository data is unchanged."
          else
            git commit -m "Update GitHub Pages repository data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
