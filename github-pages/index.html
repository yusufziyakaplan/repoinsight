<style>

    --accent: #2563eb;
    --on-accent: #ffffff;
    --accent-2: #1d4ed8;
    --accent-soft: #dbeafe;
    --sky: #0284c7;
    --amber: #b45309;
    --amber-soft: #fef3c7;
    --gain: #15803d;
    --gain-soft: #dcfce7;
    --danger: #b91c1c;
    --danger-soft: #fee2e2;
    --grad: #2563eb;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .08);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .08), 0 16px 36px rgba(0, 0, 0, .18);
    color-scheme: light;
}
:root[data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-2: #202020;
    --line: #3b3b3b;
    --ink: #f5f5f5;
    --muted: #b5b5b5;
    --accent: #e8e8e8;
    --on-accent: #111111;
    --accent-2: #c8c8c8;
    --accent-soft: #303030;
    --sky: #b8b8b8;
    --amber: #f0f0f0;
    --amber-soft: #303030;
    --gain: #e1e1e1;
    --gain-soft: #292929;
    --danger: #e1e1e1;
    --danger-soft: #292929;
    --grad: #2563eb;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    --shadow-hover: 0 2px 4px rgba(0, 0, 0, .5), 0 16px 36px rgba(0, 0, 0, .6);
    color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }

/* Tam genişlik üst alan */
.hero { background: #fff; color: #111827; padding: 22px 28px 26px; border-bottom: 1px solid var(--line); }
.hero-in { display: flex; align-items: center; justify-content: space-between; gap: 20px 32px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 46px; height: 46px; border-radius: 14px; background: #111827; display: grid; place-items: center; border: 1px solid #111827; }
.brand h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.brand p { margin: 2px 0 0; font-size: 14px; opacity: .85; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; flex: 1; justify-content: center; }
.tile { background: #eff6ff; color: #111827; border: 1px solid #bfdbfe; border-radius: 14px; padding: 8px 16px; min-width: 130px; }
.tile b { display: block; font-size: 22px; font-weight: 700; line-height: 1.2; }
.tile span { font-size: 13px; opacity: .85; }
.top-actions { display: flex; align-items: center; gap: 8px; }

.btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); font-weight: 600; font-size: 14px;
}
.btn:hover { border-color: var(--accent); }
.hero .btn { background: #2563eb; color: #fff; border-color: #2563eb; }
.hero .btn.icon-btn { background: #fff; color: #111827; border-color: var(--line); }
.hero .btn:hover { filter: brightness(.95); }
.btn[disabled] { opacity: .65; cursor: progress; }
.icon-btn { padding: 9px; }
.icon-btn svg { display: block; }

.banner { margin: 16px 28px 0; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; }
.banner.success { background: var(--gain-soft); color: var(--gain); }
.banner.error { background: var(--danger-soft); color: var(--danger); }

/* Yerleşim: tam genişlik */
.layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); padding: 20px 28px 48px; }
@media (min-width: 960px) { .layout { grid-template-columns: 280px minmax(0, 1fr); gap: 28px; } }
@media (max-width: 600px) { .layout, .hero { padding-left: 14px; padding-right: 14px; } .banner { margin-left: 14px; margin-right: 14px; } }

/* Filtre paneli */
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; align-self: start; box-shadow: var(--shadow); }
.filters > summary { list-style: none; padding: 14px 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; }
.filters > summary::-webkit-details-marker { display: none; }
@media (min-width: 960px) {
    .filters { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
    .filters > summary { display: none; }
}
.filters-body { padding: 6px 16px 16px; display: grid; gap: 18px; }
@media (min-width: 960px) { .filters-body { padding-top: 16px; } }
.field { display: grid; gap: 8px; }
.field > label, .field > .label { font-size: 13px; font-weight: 700; color: var(--accent); }
select, .search input {
    width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
}
select:hover, .search input:hover { border-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.seg button { padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 500; }
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--muted); }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.reset { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent-2); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* Araç çubuğu */
.toolbar { position: sticky; top: 0; z-index: 5; margin: 0 -8px; padding: 8px 8px 12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); display: grid; gap: 12px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--accent); pointer-events: none; }
.search input { padding: 13px 48px 13px 44px; font-size: 16px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); border-color: transparent; }
.search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: 1px solid var(--line); border-radius: 6px; padding: 0 7px; font: inherit; font-size: 12px; color: var(--muted); background: var(--surface-2); }
.toolbar-row { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 600; }
.tab:hover { border-color: var(--accent); color: var(--ink); }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, .18); }
.tab .count { margin-left: 7px; font-size: 12.5px; opacity: .8; font-weight: 500; }
.sort { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.sort select { width: auto; background: var(--surface); }
.result-line { font-size: 13.5px; color: var(--muted); margin: 2px 0 10px; }

/* Kart ızgarası */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
@media (max-width: 420px) { .list { grid-template-columns: minmax(0, 1fr); } }
.card {
    --c: var(--accent);
    position: relative; display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px;
    background: var(--card-tint, var(--surface)); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
    overflow: hidden; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card:nth-child(4n + 1) { --c: #2563eb; --card-tint: #f4f8ff; }
.card:nth-child(4n + 2) { --c: #0f9f76; --card-tint: #f2fbf7; }
.card:nth-child(4n + 3) { --c: #e28a16; --card-tint: #fffaf1; }
.card:nth-child(4n) { --c: #8b5cf6; --card-tint: #f8f5ff; }
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 5px; background: var(--c); }
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--c); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
.lang { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--muted); padding: 3px 10px 3px 8px; border-radius: 999px; background: var(--surface-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.fav { position: relative; z-index: 2; width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; }
.fav:hover { background: var(--amber-soft); color: var(--amber); }
.fav[aria-pressed="true"] { background: var(--amber-soft); color: var(--amber); }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.card h3 { margin: 0; font-size: 17px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.title { text-decoration: none; }
.title::after { content: ""; position: absolute; inset: 0; }
.title:hover .repo { color: var(--accent); }
.owner { color: var(--muted); }
.repo { font-weight: 700; }
.card.seen .repo { color: var(--muted); }
.badge { margin-left: 8px; padding: 2px 9px; border-radius: 999px; background: var(--accent-2); color: var(--on-accent); font-size: 11.5px; font-weight: 700; vertical-align: 2px; }
.desc { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 3.9em; }
.desc.none { font-style: italic; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { position: relative; z-index: 2; padding: 2px 9px; border-radius: 999px; border: 0; background: var(--accent-soft); font-size: 12px; font-weight: 500; color: var(--accent); }
.tag:hover { background: var(--accent); color: var(--on-accent); }
.tag[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.more { font-size: 12px; color: var(--muted); padding: 2px 2px; }

.card-foot { margin-top: auto; display: grid; gap: 10px; padding-top: 12px; border-top: 1px dashed var(--line); }
.foot-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.pill.stars { background: var(--amber-soft); color: var(--amber); font-size: 15px; font-weight: 700; padding: 3px 12px; }
.pill.gain { background: var(--gain-soft); color: var(--gain); }
.pill.fork { color: var(--sky); }
.when { margin-left: auto; font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--grad); }

.empty { padding: 64px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; }
.empty h2 { margin: 0 0 6px; font-size: 20px; color: var(--ink); }
.empty p { margin: 0 auto 14px; max-width: 46ch; }
.empty code { background: var(--surface-2); padding: 2px 8px; border-radius: 6px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } .card:hover { transform: none; } }
</style>

            lang: r.l || NO_LANG,
            lic: r.lc || NO_LIC,
            grp: hasLlm && hasRag ? 'both' : hasLlm ? 'llm' : hasRag ? 'rag' : 'other',
            hay: [r.n, r.d || '', r.t.join(' '), r.l || ''].join(' ').toLowerCase(),
            pushTs: r.push ? Date.parse(r.push) : 0,
            bornTs: r.born ? Date.parse(r.born) : 0,
        };
    });
    const maxStars = repos.reduce((m, r) => Math.max(m, r.s), 1);
    const totalStars = repos.reduce((sum, r) => sum + r.s, 0);

    /* ---------- Durum (URL ile senkron) ---------- */
    const params = new URLSearchParams(location.search);
    const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
    const state = {
        q: params.get('q') || '',
        tab: pick(params.get('tab'), TABS.map((t) => t[0]), 'all'),
        grp: pick(params.get('grp'), ['llm', 'rag', 'both'], ''),
        lang: params.get('lang') || '',
        lic: params.get('lic') || '',
        sort: pick(params.get('sort'), Object.keys(SORTS), 'stars'),
        topics: new Set((params.get('topics') || '').split(',').filter(Boolean)),
        unseen: params.get('unseen') === '1',
    };
    if (state.sort === 'gain' && !data.hasHistory) state.sort = 'stars';

    function syncUrl() {
        const p = new URLSearchParams();
        if (state.q) p.set('q', state.q);
        if (state.tab !== 'all') p.set('tab', state.tab);
        if (state.grp) p.set('grp', state.grp);
        if (state.lang) p.set('lang', state.lang);
        if (state.lic) p.set('lic', state.lic);
        if (state.sort !== 'stars') p.set('sort', state.sort);
        if (state.topics.size) p.set('topics', [...state.topics].join(','));
        if (state.unseen) p.set('unseen', '1');
        const qs = p.toString();
        history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    }

    /* ---------- Yardımcılar ---------- */
    function ago(ts) {
        if (!ts) return '–';
        const sec = Math.round((ts - Date.now()) / 1000);
        const units = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60]];
        for (const [unit, size] of units) {
            if (Math.abs(sec) >= size) return rtf.format(Math.round(sec / size), unit);
        }
        return tx('justNow');
    }
    function langColor(lang) { return lang === NO_LANG ? 'var(--line)' : 'var(--c)'; }
    const isNew = (r) => r.bornTs && Date.now() - r.bornTs < NEW_DAYS * 86400000;
    const isDefault = () => !state.q && !state.grp && !state.lang && !state.lic && !state.topics.size && !state.unseen && state.tab === 'all';

    /* ---------- Filtre ve sıralama ---------- */
    const terms = () => state.q.toLowerCase().split(/\s+/).filter(Boolean);

    function matches(r, t) {
        if (state.tab === 'top' && !r.top) return false;
        if (state.tab === 'rise' && !r.rise) return false;
        if (state.tab === 'fav' && !favs.has(r.n)) return false;
        if (state.grp && r.grp !== state.grp) return false;
        if (state.lang && r.lang !== state.lang) return false;
        if (state.lic && r.lic !== state.lic) return false;
        if (state.unseen && seen.has(r.n)) return false;
        for (const topic of state.topics) if (!r.t.includes(topic)) return false;
        for (const term of t) if (!r.hay.includes(term)) return false;
        return true;
    }
    const COMPARE = {
        stars: (a, b) => b.s - a.s,
        gain: (a, b) => ((b.tr ?? -Infinity) - (a.tr ?? -Infinity)) || b.s - a.s,
        push: (a, b) => b.pushTs - a.pushTs || b.s - a.s,
        born: (a, b) => b.bornTs - a.bornTs || b.s - a.s,
        forks: (a, b) => b.f - a.f || b.s - a.s,
        issues: (a, b) => b.i - a.i || b.s - a.s,
    };

    /* ---------- Satır oluşturma ---------- */
    function rowEl(r) {
        const li = el('li', 'card' + (seen.has(r.n) ? ' seen' : ''));
        li.dataset.name = r.n;
        li.style.setProperty('--c', langColor(r.lang));

        const head = el('div', 'card-head');
        const lang = el('span', 'lang');
        const displayLang = r.lang === NO_LANG ? tx('unknownLanguage') : r.lang;
        lang.append(el('span', 'dot'), document.createTextNode(displayLang + (r.lc ? ' · ' + r.lc : '')));
        const fav = el('button', 'fav');
        fav.type = 'button';
        fav.innerHTML = STAR_SVG;
        setFavState(fav, favs.has(r.n), r.n);
        head.append(lang, fav);
        li.append(head);

        const h3 = el('h3');
        const a = el('a', 'title');
        a.href = r.u;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        if (r.owner) a.append(el('span', 'owner', r.owner + '/'));
        a.append(el('span', 'repo', r.short));
        h3.append(a);
        if (isNew(r)) h3.append(el('span', 'badge', tx('newBadge')));
        li.append(h3);

        li.append(el('p', 'desc' + (r.d ? '' : ' none'), r.d || tx('missingDescription')));

        const tags = el('div', 'tags');
        const ordered = [...r.t].sort((x, y) => Number(state.topics.has(y)) - Number(state.topics.has(x)));
        ordered.slice(0, 6).forEach((topic) => {
            const b = el('button', 'tag', topic);
            b.type = 'button';
            b.dataset.topic = topic;
            b.setAttribute('aria-pressed', String(state.topics.has(topic)));
            tags.append(b);
        });
        if (ordered.length > 6) tags.append(el('span', 'more', '+' + (ordered.length - 6)));
        li.append(tags);

        const foot = el('div', 'card-foot');
        const row = el('div', 'foot-row');
        const stars = el('span', 'pill stars');
        stars.innerHTML = STAR_SVG.replace('width="18" height="18"', 'width="15" height="15"').replace('fill="none"', 'fill="currentColor"');
        stars.append(document.createTextNode(nf.format(r.s)));
        row.append(stars);
        if (r.tr !== null) {
            const days = r.trd === 1 ? tx('lastDay') : tx('lastDays', { days: r.trd });
            row.append(el('span', 'pill gain', `${r.tr >= 0 ? '+' : ''}${nf.format(r.tr)} ${days}`));
        }
        row.append(el('span', 'pill fork', `${nf.format(r.f)} ${tx('fork')}`));
        row.append(el('span', 'pill', `${nf.format(r.i)} ${tx('issue')}`));
        const when = el('span', 'when', ago(r.pushTs));
        if (r.push) when.title = tx('lastPush', { date: new Date(r.push).toLocaleString(language === 'en' ? 'en-US' : 'tr-TR') });
        row.append(when);
        foot.append(row);

        const bar = el('div', 'bar');
        const fill = document.createElement('i');
        fill.style.width = Math.max(4, (Math.log10(r.s + 1) / Math.log10(maxStars + 1)) * 100) + '%';
        bar.append(fill);
        foot.append(bar);
        li.append(foot);

        return li;
    }

    function setFavState(btn, on, name) {
        btn.setAttribute('aria-pressed', String(on));
        btn.setAttribute('aria-label', tx(on ? 'removeFavoriteAria' : 'addFavoriteAria', { name }));
        btn.title = tx(on ? 'removeFavorite' : 'addFavorite');
    }

    /* ---------- Arayüz parçaları ---------- */
    const listEl = $('list');
    const emptyEl = $('empty');

    function renderList() {
        const t = terms();
        const rows = repos.filter((r) => matches(r, t)).sort(COMPARE[state.sort]);

        listEl.replaceChildren(...rows.map(rowEl));
        listEl.hidden = rows.length === 0;
        emptyEl.hidden = rows.length !== 0;

        if (rows.length === 0) {
            emptyEl.replaceChildren();
            if (repos.length === 0) {
                emptyEl.append(el('h2', '', tx('noData')));
                emptyEl.append(el('p', '', tx('scheduledUpdate')));
            } else if (state.tab === 'fav' && favs.size === 0) {
                emptyEl.append(el('h2', '', tx('noFavorites')));
                emptyEl.append(el('p', '', tx('favoriteHint')));
            } else {
                emptyEl.append(el('h2', '', tx('noMatches')));
                emptyEl.append(el('p', '', tx('loosenFilters')));
                const b = el('button', 'btn', tx('clearFilters'));
                b.type = 'button';
                b.addEventListener('click', resetFilters);
                emptyEl.append(b);
            }
        }

        $('resultLine').textContent = repos.length
            ? tx('shown', { count: nf.format(rows.length) })
            : '';
    }

    function renderTabs() {
        const counts = {
            all: repos.length,
            top: repos.filter((r) => r.top).length,
            rise: repos.filter((r) => r.rise).length,
            fav: repos.filter((r) => favs.has(r.n)).length,
        };
        $('tabs').replaceChildren(...TABS.map(([id, label]) => {
            const b = el('button', 'tab', tx(label));
            b.type = 'button';
            b.setAttribute('aria-pressed', String(state.tab === id));
            b.append(el('span', 'count', nf.format(counts[id])));
            b.addEventListener('click', () => { state.tab = id; update(); });
            return b;
        }));
    }

    function renderGroups() {
        $('grpSeg').replaceChildren(...GROUPS.map(([id, label]) => {
            const b = el('button', '', tx(label));
            b.type = 'button';
            b.setAttribute('aria-pressed', String(state.grp === id));
            b.addEventListener('click', () => { state.grp = id; update(); });
            return b;
        }));
    }

    function fillSelect(select, counts, current, allLabel, onChange) {
        const entries = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], language));
        select.replaceChildren(new Option(`${allLabel} (${repos.length})`, ''));
        entries.forEach(([name, n]) => {
            const label = name === NO_LANG ? tx('unknownLanguage') : name === NO_LIC ? tx('noLicense') : name;
            select.append(new Option(`${label} (${n})`, name));
        });
        select.value = counts[current] ? current : '';
        if (select.value !== current) onChange('');
        select.onchange = () => { onChange(select.value); update(); };
    }

    function buildSelects() {
        const langs = {};
        const lics = {};
        repos.forEach((r) => { langs[r.lang] = (langs[r.lang] || 0) + 1; lics[r.lic] = (lics[r.lic] || 0) + 1; });
        fillSelect($('langSel'), langs, state.lang, tx('allLanguages'), (v) => { state.lang = v; });
        fillSelect($('licSel'), lics, state.lic, tx('allLicenses'), (v) => { state.lic = v; });

        const sortSel = $('sortSel');
        sortSel.replaceChildren(...Object.entries(SORTS).map(([id, key]) => {
            const label = tx(key);
            const o = new Option(label, id);
            if (id === 'gain' && !data.hasHistory) { o.disabled = true; o.textContent = label + tx('gainPending'); }
            return o;
        }));
        sortSel.value = state.sort;
        sortSel.onchange = () => { state.sort = sortSel.value; update(); };
    }

    const topicCounts = (() => {
        const counts = {};
        repos.forEach((r) => r.t.forEach((t) => { counts[t] = (counts[t] || 0) + 1; }));
        return counts;
    })();
    const popularTopics = Object.entries(topicCounts)
        .filter(([t]) => t !== 'llm' && t !== 'rag')
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .slice(0, 18)
        .map(([t]) => t);

    function renderTopics() {
        const shown = [...new Set([...state.topics, ...popularTopics])];
        $('topicChips').replaceChildren(...shown.map((topic) => {
            const b = el('button', 'chip', topic);
            b.type = 'button';
            b.dataset.topic = topic;
            b.setAttribute('aria-pressed', String(state.topics.has(topic)));
            return b;
        }));
    }

    function renderMisc() {
        $('q').value = state.q;
        $('unseenChk').checked = state.unseen;
        $('sortSel').value = state.sort;
        $('resetBtn').hidden = isDefault();

        const active = [state.grp, state.lang, state.lic, state.unseen, ...state.topics].filter(Boolean).length;
        $('filterBadge').textContent = active ? `(${active})` : '';

        const stats = $('stats');
        stats.replaceChildren();
        const tile = (label, value, title) => {
            const t = el('div', 'tile');
            t.append(el('b', '', value), el('span', '', label));
            if (title) t.title = title;
            return t;
        };
        if (repos.length) {
            const fresh = repos.filter((r) => r.bornTs && Date.now() - r.bornTs < NEW_DAYS * 86400000).length;
            stats.append(
                tile(tx('statRepos'), nf.format(repos.length)),
                tile(tx('statStars'), nf.format(totalStars)),
                tile(tx('statNew'), nf.format(fresh)),
            );
        }
        if (data.syncedAt) {
            stats.append(tile(tx('statUpdated'), ago(Date.parse(data.syncedAt)), new Date(data.syncedAt).toLocaleString(language === 'en' ? 'en-US' : 'tr-TR')));
        }
    }

    function resetFilters() {
        state.q = ''; state.tab = 'all'; state.grp = ''; state.lang = ''; state.lic = '';
        state.topics.clear(); state.unseen = false;
        update();
    }

    function update() {
        syncUrl();
        renderTabs();
        renderGroups();
        renderTopics();
        renderMisc();
        renderList();
    }

    /* ---------- Olaylar ---------- */
    listEl.addEventListener('click', (ev) => {
        const row = ev.target.closest('.card');
        if (!row) return;
        const name = row.dataset.name;

        const fav = ev.target.closest('.fav');
        if (fav) {
            const on = !favs.has(name);
            on ? favs.add(name) : favs.delete(name);
            store.set('ri:favs', [...favs]);
            setFavState(fav, on, name);
            renderTabs();
            if (state.tab === 'fav' && !on) { row.remove(); renderList(); }
            return;
        }

        const tag = ev.target.closest('.tag');
        if (tag) { toggleTopic(tag.dataset.topic); return; }

        if (ev.target.closest('a.title')) markSeen(row, name);
    });
    listEl.addEventListener('auxclick', (ev) => {
        const link = ev.target.closest('a.title');
        if (link) markSeen(link.closest('.card'), link.closest('.card').dataset.name);
    });

    function markSeen(row, name) {
        if (seen.has(name)) return;
        seen.add(name);
        store.set('ri:seen', [...seen].slice(-3000));
        row.classList.add('seen');
    }

    function toggleTopic(topic) {
        state.topics.has(topic) ? state.topics.delete(topic) : state.topics.add(topic);
        update();
    }
    $('topicChips').addEventListener('click', (ev) => {
        const chip = ev.target.closest('.chip');
        if (chip) toggleTopic(chip.dataset.topic);
    });

    let searchTimer = 0;
    $('q').addEventListener('input', (ev) => {
        state.q = ev.target.value.trim();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(update, 120);
    });
    $('unseenChk').addEventListener('change', (ev) => { state.unseen = ev.target.checked; update(); });
    $('resetBtn').addEventListener('click', resetFilters);

    document.addEventListener('keydown', (ev) => {
        const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
        if (ev.key === '/' && !typing && !ev.metaKey && !ev.ctrlKey) {
            ev.preventDefault();
            $('q').focus();
        } else if (ev.key === 'Escape' && document.activeElement === $('q')) {
            if (state.q) { $('q').value = ''; state.q = ''; update(); } else { $('q').blur(); }
        }
    });

    $('langBtn').addEventListener('click', () => {
        try { localStorage.setItem('ri:language', language === 'tr' ? 'en' : 'tr'); } catch { /* ignore */ }
        location.reload();
    });

    $('themeBtn').addEventListener('click', () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem('ri:theme', next); } catch { /* yoksay */ }
    });


    // Filtre paneli: geniş ekranda hep açık, dar ekranda kapalı başlar.
    const filters = $('filters');
    const wide = window.matchMedia('(min-width: 960px)');
    const syncPanel = () => { filters.open = wide.matches; };
    syncPanel();
    wide.addEventListener('change', syncPanel);

    buildSelects();
    update();
})();
</script>
</body>
</html>
